services:
  postgres:
    image: postgres:16-alpine
    container_name: styleai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: styleai_dev
    ports:
      - "5432:5432"
    volumes:
      - styleai_pgdata:/var/lib/postgresql/data

volumes:
  styleai_pgdata:
